# Disposable test VM only. Installation users never need this fixture.
default_config:
demo:
input_boolean:
  fhc_fixture_onoff:
    name: FHC fixture power
    initial: false
light:
  - platform: group
    name: FHC 테스트 전체등
    unique_id: fhc_fixture_group
    entities:
      - light.ceiling_lights
      - light.bed_light
template:
  - light:
      - name: FHC 단순등
        unique_id: fhc_fixture_simple
        state: "{{ is_state('input_boolean.fhc_fixture_onoff', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.fhc_fixture_onoff
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.fhc_fixture_onoff
# FIX_06 fixture helpers (VM only). local_calendar는 YAML platform이 제거되어
# Settings→Devices에서 config entry로 생성해야 한다(verify_live_bc.py가 flow API로 재생성).
input_datetime:
  fhc_wake:
    name: FHC 기상 시각
    has_time: true
input_text:
  fhc_secret:
    name: FHC 기록
    mode: password
