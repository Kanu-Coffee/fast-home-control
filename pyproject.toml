[project]
name = "fast-home-control"
version = "0.2.0.dev5"
description = "A zero-config decision-model remote for Home Assistant OS"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "websockets>=15,<17", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "playwright>=1.50,<2", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["addon/app"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
