name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check app tests scripts
      - run: uv run ruff format --check app tests scripts
      - run: uv run pytest -q
      - run: uv export --frozen --no-dev --no-emit-project --no-hashes --no-header --output-file /tmp/requirements.txt && diff requirements.txt /tmp/requirements.txt
      - run: docker build -t fhc-check .
