name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check addon/app tests scripts
      - run: uv run ruff format --check addon/app tests scripts
      - run: uv run pytest -q
      - run: uv export --frozen --no-dev --no-emit-project --no-hashes --no-header --output-file /tmp/requirements.txt && diff addon/requirements.txt /tmp/requirements.txt
      - run: docker build -t fhc-check addon
  arm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: addon
          platforms: linux/arm64
          push: false
          build-args: BUILD_ARCH=aarch64
