name: Publish Dev
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check app tests scripts && uv run pytest -q
      - name: Require a commit already on dev and matching version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin dev
          git merge-base --is-ancestor HEAD origin/dev
          VERSION=$(uv run python -c 'import yaml; print(yaml.safe_load(open("addon/config.yaml"))["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/kanu-coffee/fast-home-control-dev:${{ env.VERSION }}
          build-args: BUILD_VERSION=${{ env.VERSION }}
